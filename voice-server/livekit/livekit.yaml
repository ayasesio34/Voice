# ═══════════════════════════════════════════════════════════════
# LiveKit 自托管配置
#
# 目标环境：YOUR_SERVER_IP（普通 VPS），2 vCPU / 2 GiB，
#           无域名 / 无证书 / 单节点 / **20 Mbps 出口**
#
# 改完这个文件要重启才生效：
#   docker compose restart livekit
#
# 这个文件里含 API 密钥，权限必须 600（init.sh 会自动设好）
# ═══════════════════════════════════════════════════════════════

# 信令端口（WebSocket）。客户端连这个。
# 官方建议生产环境放在带 TLS 的负载均衡后面；本架构用原生桌面客户端，
# 直接 ws:// 明文连接即可 —— 原生客户端没有浏览器的安全上下文限制。
port: 7880

rtc:
  # WebRTC over TCP：UDP 被防火墙拦掉时的兜底通道。
  # 这个端口不能被 TLS 终止，也不能挡在负载均衡后面。
  tcp_port: 7881

  # ── UDP 端口复用（★ 只用一个端口）────────────────────────────
  # LiveKit 默认用 50000-60000（10001 个端口，每个参与者占 2 个）。
  # 这里改成**单端口复用**：所有参与者的媒体都走这一个 UDP 端口。
  #   · 防火墙/安全组只需要一条规则
  #   · NAT 行为最可预测 ✓
  #
  # ⚠️ 设了 udp_port 之后，port_range_start / port_range_end 必须留空，
  #    否则复用不生效。不要"顺手加回来"。
  #
  # 现在这台机器（YOUR_SERVER_IP）是**普通 VPS** ✓ 公网 IP 直通、端口自由 ✓
  # 所以直接用标准端口 7882（内外一致，不用 NAT 映射）✓
  udp_port: 7882

  # ── 公网 IP 通告 ────────────────────────────────────────────
  # 阿里云 ECS 的"公网 IP"是 NAT 映射：网卡上只有内网 IP（172.28.217.34），
  # 公网 IP 不在进程可见的接口上。不显式指定的话，LiveKit 会把内网 IP
  # 当作候选地址通告给客户端 → 客户端永远连不上。
  #
  # 这里用显式指定而不是 use_external_ip: true，因为后者依赖 STUN 探测，
  # 而国内环境下 Google 的 STUN 服务器常常不可达，探测失败就会用错 IP。
  #
  # 👉 换公网 IP / 换机器时，改下面这一行（init.sh 会自动帮你改）
  use_external_ip: false
  node_ip: YOUR_SERVER_IP

  # 拥塞控制：让 SFU 监测下行拥塞并自动调节发送速率。
  # 默认就是开的，这里显式写出来，免得以后被误关。
  congestion_control:
    enabled: true
    # 极端拥塞时允许 SFU 暂停某些 track，保证其他流顺畅
    allow_pause: true

  # UDP 不稳定时自动回落到 ICE/TCP（默认 true，显式写出）
  allow_tcp_fallback: true

# ── 单节点，不需要 Redis ──────────────────────────────────────
# LiveKit 只在多节点部署时才需要 Redis 做房间路由。
# 单节点用内存状态即可，日志里那句 "not suitable for multi-node"
# 的警告可以忽略。
#
# 这里刻意不写 redis: 段 —— 写了空的 LiveKit 会尝试去连接。
# 省下约 50 MB 内存。

# ── 没有 TURN ─────────────────────────────────────────────────
# LiveKit 内置 TURN，但源码里（pkg/service/turn.go）要求：
# 只要 tls_port > 0 就必须有 domain，因为 TURN/TLS 的证书和
# realm 路由是绑定在域名上的：
#
#   if turnConf.TLSPort > 0 {
#       if turnConf.Domain == "" {
#           return nil, errors.New("TURN domain required")
#       }
#   }
#
# 而 tls_port 默认是 5349 —— 也就是说一开 turn.enabled: true
# 就很可能直接启动失败。没有域名的前提下，TURN/TLS 走不通。
#
# 当前的兜底链条：
#   host candidate（node_ip 直连） → ICE/TCP :7881 → 结束
# 家庭宽带和大部分校园网够用。
#
# 如果以后确认有用户连不上（深层 NAT、企业防火墙），再回头解决
# 域名 + TURN 的问题。tools/test-page 能帮你确认到底有没有人连不上。
#
# turn:
#   enabled: true
#   udp_port: 3478
#   tls_port: 0                    # 必须显式关掉，否则触发 domain 校验
#   # domain: turn.example.com     # 有域名时才能开 TURN/TLS

# ── API 密钥对 ────────────────────────────────────────────────
# 由 scripts/init.sh 自动替换成随机值。
# ⚠️ 必须和 .env 里的 LIVEKIT_API_KEY / LIVEKIT_API_SECRET 完全一致，
#    否则后端签发的 token 会被 LiveKit 拒绝。
keys:
  REPLACE_API_KEY: REPLACE_API_SECRET

# ── 日志 ──────────────────────────────────────────────────────
logging:
  level: info
  # pion 是 LiveKit 依赖的 WebRTC 库。默认 error 就够；
  # 排查连接问题时可以临时改成 debug，会详细打印 ICE 候选交换过程。
  pion_level: error
  json: false

# ── 房间默认值 ────────────────────────────────────────────────
room:
  # 允许客户端直接进入不存在的房间（不预建房间，省事）
  auto_create: true
  # 空房间保留 5 分钟
  empty_timeout: 300
  # 最后一个人离开后保留 20 秒，避免频繁进出时反复重建房间
  departure_timeout: 20

  # 刻意不锁 enabled_codecs。
  # 屏幕共享要上 1080p60 时再按 docs/1080p60-screen-share.md 的建议来配 ——
  # 提前锁死很容易静默地让某个编码器不可用，排查起来非常痛苦。
  #
  # enabled_codecs:
  #   - mime: audio/opus
  #   - mime: video/h264
  #   - mime: video/vp9

# ── 监控 ──────────────────────────────────────────────────────
# 暴露 Prometheus 指标在 :6789/metrics
# ⚠️ 6789 不要加到安全组！只在本机 curl 查看。
#
# 值得关注的指标：
#   livekit_participant_total
#   livekit_track_published_total
#   livekit_room_total
prometheus:
  port: 6789

# ── 资源限制（2 GiB 机器上的安全阀）───────────────────────────
limit:
  # 单节点的 track 上限，按 CPU 数算。显式放宽，避免小机器被默认值卡住。
  # -1 = 不限制。真正的瓶颈是出口带宽，不是这个。
  num_tracks: -1

  # ⚠️ 出口速率上限（字节/秒）必须和这台机器的**真实出口带宽**匹配 ✓
  #
  # 这台机器（YOUR_SERVER_IP）出口是 **20 Mbps** ✓
  #   算法：20 Mbps ÷ 8 = 2,500,000 字节/秒 ✓
  #   留 1 Mbps 余量给后端 API、聊天、文件下载、以及 RTP/UDP 头开销 ✓
  #   → **19 Mbps = 2,375,000** ✓
  #
  # 不匹配的后果（旧机器 6 Mbps 时踩过 ✓）：LiveKit 以为"我还能发更多"✗
  #   → 缓冲区堆积 → 延迟暴涨、画面卡成一片，而 CPU 和内存都看不出来异常 ✗
  # 设成匹配值之后它会**主动降码率** ✓ 表现是"画质降一点，但不卡" ✓
  #
  # 20 Mbps 够干什么（含语音约 1 Mbps）：
  #   · 1 人看 1080p30（8 Mbps）✓ 有余量
  #   · 3~4 人看 720p30 ✓ 够用
  #
  # 想关掉就改成 -1。
  bytes_per_sec: 2375000
